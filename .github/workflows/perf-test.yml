name: DB Query Performance Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  perf-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stellar-co-star-remit-mortage
          POSTGRES_PASSWORD: stellar-co-star-remit-mortage_pass
          POSTGRES_DB: stellar-co-star-remit-mortage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Generate Prisma Client
      working-directory: ./backend
      run: npx prisma generate

    - name: Run Migrations
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://stellar-co-star-remit-mortage:stellar-co-star-remit-mortage_pass@localhost:5432/stellar-co-star-remit-mortage
      run: npx prisma migrate deploy

    - name: Run DB Performance Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://stellar-co-star-remit-mortage:stellar-co-star-remit-mortage_pass@localhost:5432/stellar-co-star-remit-mortage
      run: npx tsx scripts/db-perf.ts
